name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor the README promises, because that is where fetch and
        # the built-in test runner both exist. 20 and 22 are what people run.
        node: ["18", "20", "22"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: typecheck
        run: npx tsc --noEmit

      - name: build
        run: npm run build

      - name: test
        run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The package has no runtime dependencies by design, so this should stay
      # trivially clean. If it ever is not, something was added that should not
      # have been.
      - name: audit production dependencies
        run: npm audit --omit=dev --audit-level=low
